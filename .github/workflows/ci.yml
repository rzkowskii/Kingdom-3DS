# Builds and tests everything that doesn't need the game's files (CI has
# no copy of the game, so nothing here extracts assets or runs the game).
name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Desktop, game logic and tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Libraries for macroquad and cpal
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev shellcheck
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: python3 tools/check_public_files.py
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      # Synthetic islands only (no game files): every scenario over 24 seeds
      # and at 1, 2 and 3 ticks per frame (the Old 3DS catch-up path).
      - name: Gameplay regression sweep
        run: cargo run --release --locked -p regress -- run --seeds 24 --tpf 1,2,3 --report regress-report.toml
      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regress-report
          path: regress-report.toml
          if-no-files-found: ignore
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: setup.sh lints
        run: shellcheck build.sh tools/setup.sh tools/cia/build.sh

  n3ds:
    name: 3DS build
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Clang for libctru binding generation
        run: apt-get update && apt-get install -y --no-install-recommends clang libclang-dev
      - name: Add devkitPro tools to PATH
        run: |
          echo "$DEVKITARM/bin" >> "$GITHUB_PATH"
          echo "$DEVKITPRO/tools/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/n3ds
      - name: cargo fmt (3DS crate, outside the workspace)
        working-directory: crates/n3ds
        run: cargo +nightly fmt --check
      - run: cargo install --locked cargo-3ds
      # The romfs is made from your own game files, so CI builds with an
      # empty one: this checks the code compiles and links.
      - name: cargo 3ds build
        working-directory: crates/n3ds
        run: |
          mkdir -p romfs
          cargo +nightly 3ds build --release
