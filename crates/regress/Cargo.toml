[package]
name = "regress"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Deterministic gameplay regression and original-game parity framework (headless)"
publish = false

[dependencies]
game = { path = "../game", features = ["serde", "save"] }
scene = { path = "../scene" }
png = "0.18.1"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.8.23"
