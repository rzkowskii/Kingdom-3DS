# Measured from the original game with the KingdomTrace harness
# (`regress orig`). Numbers only; the traces stay local.
id = "trace-walk-speed"
title = "Walking speed on the default steed, measured in the original"
actions = ["60 frames: dir 0", "600 frames: dir 1", "120 frames: dir 0"]
observation = []
scenarios = ["monarch_walk"]

[original]
game_version = "Kingdom: New Lands 1.2.8 (Unity 2017.1.2p1)"
platform = "LinuxPlayer"

[setup]
description = "Walk right for 10 s from the campfire on Land One: steady walking speed outside forests. Intro skipped as the skip button does; Time.captureFramerate = 60; UnityEngine.Random seeded per run."

[setup.initial]
"@player_x" = "Managers.kingdom.campfirePosition"
island = "Land One, fresh start"
seeds = "1,2,3"

[[expected]]
metric = "walk_speed"
value = 1.8103
tolerance = 0.02
unit = "units/s"

[evidence]
kind = "repeated-measurement"
source = "KingdomTrace harness (tools/orig-harness) scenario orig_walk, 3 run(s); traces kept locally in gamefiles/harness/traces/orig_walk/"
confidence = "medium"
independently_verified = false
verification = ""
samples = 3
recorded_by = ""
date = "2026-11-08"
