# What the harness samples and logs in the original game, by name only.
# Appended to every config `regress orig export` writes. The port's side of
# each key is in crates/regress/src/orig.rs (`port_sample`).

[sample]
time = Managers.director.currentTime
day = Managers.director.currentDay
daytime = Managers.kingdom.isDaytime
shown_day = Managers.kingdom.day
x = Managers.kingdom.player.transform.position.x
ground = Managers.kingdom.player._groundType
wallet = Managers.kingdom.player._wallet.coins
state = Managers.game.state
# The citizen a scenario's "@drive" setup spawned (null otherwise).
cx = @driven.transform.position.x
cset = @driven.Mover._moveSpeed
# The blended lighting (colours as r,g,b,a) and the presets on its stack.
ambient = Managers.blender.state.ambientColor.value
sky_top = Managers.blender.state.skyTopColor.value
sky_bottom = Managers.blender.state.skyBottomColor.value
stars = Managers.blender.state.stars.value
lights = @blender_stack

[hooks]
# event name (the port's GameEvent kind) = Type.Method in the original
Bag.Spilled = Player.CoinFellFromBag
Coin.PickedUp = Wallet.SuckCoin
Pay.Complete = Payable.TransactionComplete
Pay.Cancel = Player.CancelTransaction
